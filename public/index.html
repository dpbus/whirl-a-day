<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Whirl-a-Day</title>
  <meta name="description" content="Spinner wheels that remember what each player has already spun: advent calendars, chore wheels, dinner pickers.">
  <meta name="theme-color" content="#f4f4f7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Whirl-a-Day">
  <!-- Only this site's own files may load. No inline scripts or style attributes. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://whirladay.com; media-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <canvas id="ambient" aria-hidden="true"></canvas>

  <div class="app">
    <header class="topbar">
      <h1 class="wheel-heading">
        <button id="wheel-switcher" class="wheel-switcher" aria-haspopup="dialog" title="Switch wheel">
          <span id="wheel-title">Whirl-a-Day</span><span class="visually-hidden"> (switch wheel)</span><span data-icon="chevron-down" data-size="22"></span>
        </button>
      </h1>
      <div class="topbar-buttons">
        <button id="invite-btn" class="icon-btn" aria-label="Invite people (QR code)" title="Invite people" hidden><span data-icon="qr-code" data-size="22"></span></button>
        <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings"><span data-icon="settings" data-size="22"></span></button>
      </div>
    </header>

    <p id="storage-warning" class="banner" role="alert" hidden></p>
    <p id="online-status" class="banner online-status" role="status" hidden></p>

    <div id="players" class="tabs" role="group" aria-label="Players"></div>

    <main>
      <section class="stage">
        <div class="wheel-wrap">
          <svg id="pointer" class="pointer" viewBox="0 0 40 50" aria-hidden="true">
            <path d="M20 48 L4 12 A17 17 0 1 1 36 12 Z" />
            <circle cx="20" cy="16" r="6" />
          </svg>
          <canvas id="wheel" role="img" aria-label="Wheel. Tap to spin."></canvas>
        </div>
        <button id="spin-btn" class="spin-btn">Spin!</button>
        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <section id="progress" class="card progress" hidden>
        <h2 id="progress-title"></h2>
        <div id="history"></div>
      </section>
    </main>
  </div>

  <dialog id="result-dialog" class="dialog result" aria-labelledby="result-kicker result-label">
    <form method="dialog" class="dialog-body">
      <div id="result-emoji" class="result-emoji" aria-hidden="true">🎁</div>
      <p id="result-kicker" class="result-kicker"></p>
      <div id="result-label" class="result-label" aria-live="assertive"></div>
      <p id="result-surprise" class="result-surprise" hidden></p>
      <button class="btn primary big" autofocus>Yay!</button>
    </form>
  </dialog>

  <dialog id="settings-dialog" class="dialog settings" aria-label="Settings">
    <header class="settings-header">
      <h2>Settings</h2>
      <form method="dialog"><button class="icon-btn" aria-label="Close settings"><span data-icon="x"></span></button></form>
    </header>
    <div class="settings-tabs" role="tablist" aria-label="Settings sections">
      <button type="button" role="tab" id="settings-tab-wheel" aria-controls="settings-body" data-tab="wheel">This wheel</button>
      <button type="button" role="tab" id="settings-tab-players" aria-controls="settings-body" data-tab="players">Players</button>
      <button type="button" role="tab" id="settings-tab-general" aria-controls="settings-body" data-tab="general">General</button>
      <button type="button" role="tab" id="settings-tab-backup" aria-controls="settings-body" data-tab="backup">Backup</button>
    </div>
    <div id="settings-body" class="settings-body" role="tabpanel" tabindex="0"></div>
  </dialog>

  <dialog id="wheels-dialog" class="dialog small wheels-menu" aria-labelledby="wheels-dialog-title">
    <div class="dialog-body">
      <h2 id="wheels-dialog-title">Your wheels</h2>
      <ul id="wheels-menu-list" class="wheels-menu-list"></ul>
      <div class="dialog-actions">
        <button type="button" class="btn" id="wheels-new"><span data-icon="plus" data-size="18"></span> New wheel</button>
        <button type="button" class="btn primary" id="wheels-close">Done</button>
      </div>
    </div>
  </dialog>

  <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
  <canvas id="confetti" aria-hidden="true"></canvas>
</body>
</html>
